<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ISP Billing Dealer Panel</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    margin:0;
    font-family:Inter,Arial,sans-serif;
    background:#060b16;
    color:#f8fafc;
}
.card{
    background:#0d1526;
    border:1px solid #1e293b;
    border-radius:18px;
}
input,select{
    width:100%;
    box-sizing:border-box;
    background:#09111f;
    color:#fff;
    border:1px solid #26354d;
    padding:12px;
    border-radius:10px;
    outline:none;
}
input:focus,select:focus{
    border-color:#6366f1;
}
.btn{
    padding:11px 16px;
    border-radius:10px;
    font-weight:700;
}
.gradient{
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
}
.nav{
    padding:12px;
    width:100%;
    text-align:left;
    border-radius:10px;
    color:#94a3b8;
}
.nav:hover,.nav.active{
    background:#312e81;
    color:#fff;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage"
class="min-h-screen flex items-center justify-center p-5">

<div class="card p-8 w-full max-w-md text-center">

<div class="text-5xl">🌐</div>

<h1 class="text-3xl font-black mt-4">
ISP BILLING
</h1>

<p class="text-slate-400 mt-2">
Dealer Management Panel
</p>

<button id="googleLogin"
class="w-full bg-white text-black btn mt-7">
Continue with Google
</button>

<div id="loginError"
class="text-red-400 text-sm mt-4">
</div>

</div>
</div>


<!-- LICENSE -->

<div id="licensePage"
class="hidden min-h-screen flex items-center justify-center p-5">

<div class="card p-8 w-full max-w-md">

<div class="text-center">

<div class="text-5xl">🔐</div>

<h1 class="text-2xl font-black mt-4">
License Verification
</h1>

<p class="text-slate-400 text-sm mt-2">
Enter your dealer license key.
</p>

</div>

<input
id="licenseInput"
class="mt-6"
placeholder="ISP-XXXX-XXXX-XXXX">

<button
id="licenseBtn"
class="w-full gradient btn mt-4">
Verify License
</button>

<div id="licenseStatus"
class="text-center text-sm mt-4">
</div>

<button
id="licenseLogout"
class="w-full bg-slate-800 btn mt-5">
Logout
</button>

</div>
</div>


<!-- APP -->

<div id="app" class="hidden">

<!-- SIDEBAR -->

<aside
class="fixed left-0 top-0 bottom-0 w-64 bg-[#080d18] border-r border-slate-800 p-4 hidden md:block">

<div class="text-xl font-black mb-8">
🌐 ISP BILLING
<div class="text-xs text-green-400">
DEALER PANEL
</div>
</div>

<nav class="space-y-2">

<button class="nav active"
onclick="showPage('dashboard')">
📊 Dashboard
</button>

<button class="nav"
onclick="showPage('customers')">
👥 Customers
</button>

<button class="nav"
onclick="showPage('packages')">
📦 Packages
</button>

<button class="nav"
onclick="showPage('bills')">
🧾 Bills
</button>

<button class="nav"
onclick="showPage('payments')">
💰 Payments
</button>

</nav>

<button
id="logoutBtn"
class="absolute bottom-5 left-4 right-4 bg-red-500/10 text-red-400 btn">
Logout
</button>

</aside>


<!-- MAIN -->

<main class="md:ml-64 p-5 lg:p-8">

<div class="flex justify-between items-center mb-6">

<div>
<h1 id="pageTitle"
class="text-2xl font-black">
Dashboard
</h1>

<p id="dealerEmail"
class="text-xs text-slate-500">
</p>
</div>

<div
class="bg-green-500/10 text-green-400 px-4 py-2 rounded-full text-xs">
● LICENSE ACTIVE
</div>

</div>


<!-- DASHBOARD -->

<section id="dashboardPage">

<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">

<div class="card p-5">
<div class="text-slate-500 text-xs">
CUSTOMERS
</div>
<div id="totalCustomers"
class="text-3xl font-black mt-3">
0
</div>
</div>

<div class="card p-5">
<div class="text-slate-500 text-xs">
ACTIVE
</div>
<div id="activeCustomers"
class="text-3xl font-black text-green-400 mt-3">
0
</div>
</div>

<div class="card p-5">
<div class="text-slate-500 text-xs">
UNPAID
</div>
<div id="unpaidBills"
class="text-3xl font-black text-red-400 mt-3">
0
</div>
</div>

<div class="card p-5">
<div class="text-slate-500 text-xs">
PAYMENTS
</div>
<div id="totalPayments"
class="text-3xl font-black text-indigo-400 mt-3">
Rs 0
</div>
</div>

</div>


<div class="card p-6 mt-5">

<h2 class="text-xl font-black">
🏢 Dealer Information
</h2>

<div id="dealerInfo"
class="grid md:grid-cols-2 gap-3 mt-5">
</div>

</div>

</section>


<!-- CUSTOMERS -->

<section id="customersPage"
class="hidden">

<div class="card p-5">

<div class="flex justify-between gap-3 flex-wrap">

<h2 class="text-xl font-black">
👥 Customers
</h2>

<button
onclick="openCustomerForm()"
class="gradient btn">
+ Add Customer
</button>

</div>

<input
id="customerSearch"
oninput="renderCustomers()"
class="mt-5"
placeholder="Search customer...">

<div id="customerList"
class="space-y-3 mt-5">
</div>

</div>

</section>


<!-- PACKAGES -->

<section id="packagesPage"
class="hidden">

<div class="card p-5">

<div class="flex justify-between">

<h2 class="text-xl font-black">
📦 Packages
</h2>

<button
onclick="openPackageForm()"
class="gradient btn">
+ Add Package
</button>

</div>

<div id="packageForm"
class="hidden mt-5 grid md:grid-cols-3 gap-3">

<input
id="packageName"
placeholder="Package name">

<input
id="packageSpeed"
placeholder="Speed e.g. 10 Mbps">

<input
id="packagePrice"
type="number"
placeholder="Monthly price">

<button
onclick="addPackage()"
class="gradient btn">
Save Package
</button>

</div>

<div id="packageList"
class="grid md:grid-cols-3 gap-4 mt-5">
</div>

</div>

</section>


<!-- BILLS -->

<section id="billsPage"
class="hidden">

<div class="card p-5">

<div class="flex justify-between">

<h2 class="text-xl font-black">
🧾 Bills
</h2>

<button
onclick="createAllBills()"
class="gradient btn">
Create Monthly Bills
</button>

</div>

<div id="billList"
class="space-y-3 mt-5">
</div>

</div>

</section>


<!-- PAYMENTS -->

<section id="paymentsPage"
class="hidden">

<div class="card p-5">

<h2 class="text-xl font-black">
💰 Payments
</h2>

<div id="paymentList"
class="space-y-3 mt-5">
</div>

</div>

</section>

</main>
</div>


<!-- CUSTOMER MODAL -->

<div id="customerModal"
class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-5">

<div class="card p-6 w-full max-w-lg">

<div class="flex justify-between">

<h2 class="text-xl font-black">
Add Customer
</h2>

<button onclick="closeCustomerForm()">
✕
</button>

</div>

<div class="grid gap-3 mt-5">

<input id="cName" placeholder="Customer Name">

<input id="cPhone" placeholder="Phone">

<input id="cAddress" placeholder="Address">

<input id="cUsername" placeholder="Username">

<input id="cEmail" placeholder="Email">

<select id="cPackage">
<option value="">Select Package</option>
</select>

<input
id="cExpiry"
type="date"
>

</div>

<button
onclick="createCustomer()"
class="w-full gradient btn mt-5">
Create Customer
</button>

</div>
</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getDatabase,
ref,
get,
set,
update,
remove
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* FIREBASE */

const firebaseConfig={

apiKey:
"AIzaSyBAzVYtCzLzdM9R-Lt1-8EiUpy9_dPrj6E",

authDomain:
"isp-billing-system-27cf8.firebaseapp.com",

databaseURL:
"https://isp-billing-system-27cf8-default-rtdb.firebaseio.com",

projectId:
"isp-billing-system-27cf8",

storageBucket:
"isp-billing-system-27cf8.firebasestorage.app",

messagingSenderId:
"643339508063",

appId:
"1:643339508063:web:232e6769f7128b6e323eea"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);

const provider=new GoogleAuthProvider();

provider.setCustomParameters({
prompt:"select_account"
});


let currentUser=null;
let dealer=null;
let dealerId=null;

let customers={};
let packages={};
let bills={};
let payments={};


/* GOOGLE */

document.getElementById("googleLogin").onclick=async()=>{

const btn=document.getElementById("googleLogin");
const error=document.getElementById("loginError");

btn.disabled=true;
btn.innerText="Signing in...";
error.innerText="";

try{

await signInWithPopup(auth,provider);

}catch(e){

console.error(e);

error.innerText=e.code+" : "+e.message;

btn.disabled=false;
btn.innerText="Continue with Google";

}

};


/* AUTH */

onAuthStateChanged(auth,async user=>{

currentUser=user;

if(!user){

localStorage.removeItem("ispDealerId");
localStorage.removeItem("ispLicenseVerified");

showLogin();

return;

}


const savedId=
localStorage.getItem("ispDealerId");

const verified=
localStorage.getItem("ispLicenseVerified");


if(savedId && verified==="true"){

try{

const snap=
await get(ref(db,"dealers/"+savedId));

if(snap.exists()){

dealerId=savedId;
dealer=snap.val();

await loadData();

openApp();

return;

}

}catch(e){

console.error(e);

}

localStorage.removeItem("ispDealerId");
localStorage.removeItem("ispLicenseVerified");

}

showLicense();

});


function showLogin(){

document.getElementById("loginPage")
.classList.remove("hidden");

document.getElementById("licensePage")
.classList.add("hidden");

document.getElementById("app")
.classList.add("hidden");

}


function showLicense(){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("licensePage")
.classList.remove("hidden");

document.getElementById("app")
.classList.add("hidden");

}


/* LICENSE */

document.getElementById("licenseBtn")
.onclick=verifyLicense;


async function verifyLicense(){

const input=document.getElementById("licenseInput");

const status=document.getElementById("licenseStatus");

const btn=document.getElementById("licenseBtn");

const key=input.value.trim().toUpperCase();


if(!key){

status.innerText="❌ Enter License Key.";

return;

}

btn.disabled=true;
btn.innerText="Verifying...";
status.innerText="Checking...";


try{

const snap=await get(ref(db,"dealers"));

if(!snap.exists()){

throw new Error("No dealers found.");

}


const all=snap.val();

let found=null;
let foundId=null;


for(const [id,d] of Object.entries(all)){

const savedKey=
String(
d.LicenseKey ||
d.licenseKey ||
""
)
.trim()
.toUpperCase();

if(savedKey===key){

found=d;
foundId=id;
break;

}

}


if(!found){

status.innerText="❌ Invalid License Key.";

btn.disabled=false;
btn.innerText="Verify License";

return;

}


/* STATUS */

const dealerStatus=
String(
found.Status ||
found.status ||
"active"
).toLowerCase();


if(
dealerStatus==="suspended" ||
dealerStatus==="inactive"
){

status.innerText=
"🔴 Dealer account suspended.";

btn.disabled=false;
btn.innerText="Verify License";

return;

}


/* EXPIRY */

const expiry=
found.LicenseExpiry ||
found.licenseExpiry ||
"";


if(expiry){

const expiryDate=
new Date(expiry+"T23:59:59");

if(expiryDate < new Date()){

status.innerText=
"⏰ License expired: "+expiry;

btn.disabled=false;
btn.innerText="Verify License";

return;

}

}


/* SAVE */

await update(
ref(db,"dealers/"+foundId),
{
uid:currentUser.uid,
loginEmail:currentUser.email,
licenseVerified:true,
licenseVerifiedAt:new Date().toISOString()
}
);


dealerId=foundId;

dealer={
...found,
uid:currentUser.uid,
loginEmail:currentUser.email
};


localStorage.setItem(
"ispDealerId",
foundId
);

localStorage.setItem(
"ispLicenseVerified",
"true"
);


await loadData();

openApp();


}catch(e){

console.error(e);

status.innerText=
"❌ "+e.message;

btn.disabled=false;
btn.innerText="Verify License";

}

}


/* LOAD */

async function loadData(){

const [
customersSnap,
packagesSnap,
billsSnap,
paymentsSnap
]=await Promise.all([

get(ref(db,"customers")),

get(ref(db,"packages")),

get(ref(db,"bills")),

get(ref(db,"payments"))

]);


customers=
customersSnap.exists()
?customersSnap.val()
:{};

packages=
packagesSnap.exists()
?packagesSnap.val()
:{};

bills=
billsSnap.exists()
?billsSnap.val()
:{};

payments=
paymentsSnap.exists()
?paymentsSnap.val()
:{};


renderAll();

checkExpiryToday();

}


/* APP */

function openApp(){

document.getElementById("licensePage")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

document.getElementById("dealerEmail")
.innerText=
dealer.loginEmail ||
currentUser.email ||
"";

}


/* NAVIGATION */

window.showPage=function(page){

[
"dashboard",
"customers",
"packages",
"bills",
"payments"
].forEach(p=>{

document.getElementById(p+"Page")
.classList.add("hidden");

});


document.getElementById(page+"Page")
.classList.remove("hidden");


const titles={
dashboard:"Dashboard",
customers:"Customers",
packages:"Packages",
bills:"Bills",
payments:"Payments"
};

document.getElementById("pageTitle")
.innerText=titles[page];

};


/* RENDER */

function renderAll(){

renderDashboard();
renderDealer();
renderCustomers();
renderPackages();
renderBills();
renderPayments();
renderPackageOptions();

}


/* DASHBOARD */

function renderDashboard(){

const list=Object.values(customers);

const active=list.filter(c=>
String(c.Status||c.status||"")
.toLowerCase()==="active"
).length;

const unpaid=
Object.values(bills).filter(b=>
String(b.Status||b.status||"")
.toLowerCase()==="unpaid"
).length;

const total=
Object.values(payments).reduce(
(sum,p)=>
sum+Number(p.amount||p.Amount||0),
0
);


document.getElementById("totalCustomers")
.innerText=list.length;

document.getElementById("activeCustomers")
.innerText=active;

document.getElementById("unpaidBills")
.innerText=unpaid;

document.getElementById("totalPayments")
.innerText=
"Rs "+total.toLocaleString();

}


/* DEALER */

function renderDealer(){

document.getElementById("dealerInfo")
.innerHTML=`

<div class="card p-4">
<div class="text-slate-500 text-xs">DEALER</div>
<b>${esc(dealer.name||"-")}</b>
</div>

<div class="card p-4">
<div class="text-slate-500 text-xs">COMPANY</div>
<b>${esc(dealer.company||"-")}</b>
</div>

<div class="card p-4">
<div class="text-slate-500 text-xs">LICENSE</div>
<b class="text-indigo-400">
${esc(dealer.LicenseKey||dealer.licenseKey||"-")}
</b>
</div>

<div class="card p-4">
<div class="text-slate-500 text-xs">EXPIRY</div>
<b>
${esc(dealer.LicenseExpiry||dealer.licenseExpiry||"-")}
</b>
</div>

`;

}


/* CUSTOMERS */

function renderCustomers(){

const search=
(document.getElementById("customerSearch")
?.value||"").toLowerCase();

let html="";


Object.entries(customers)
.forEach(([id,c])=>{

if(c.dealerId && c.dealerId!==dealerId)
return;

const text=
`${c.name||""} ${c.username||""} ${c.phone||""}`
.toLowerCase();

if(!text.includes(search))
return;


const expiry=
c["Expiry Date"] ||
c.expiryDate ||
"";


const status=
String(c.Status||c.status||"Active");


html+=`

<div class="card p-5">

<div class="flex justify-between gap-3">

<div>
<h3 class="text-lg font-black">
${esc(c.name||"-")}
</h3>

<p class="text-xs text-slate-500">
${esc(c.username||"-")} •
${esc(c.phone||"-")}
</p>
</div>

<span class="text-xs ${
status.toLowerCase()==="active"
?"text-green-400"
:"text-red-400"
}">
● ${esc(status)}
</span>

</div>

<div class="grid md:grid-cols-4 gap-3 mt-4 text-sm">

<div>
<span class="text-slate-500">Package</span>
<br>
<b>${esc(c.package||"-")}</b>
</div>

<div>
<span class="text-slate-500">Monthly</span>
<br>
<b>
Rs ${Number(
c["Monthly fee"]||
c.monthlyFee||
0
).toLocaleString()}
</b>
</div>

<div>
<span class="text-slate-500">Expiry</span>
<br>
<b>${esc(expiry||"-")}</b>
</div>

<div>

<button
onclick="sendWhatsApp('${id}')"
class="w-full bg-green-600 btn">
📱 WhatsApp Bill
</button>

</div>

</div>

<div class="flex gap-2 mt-4">

<button
onclick="editCustomer('${id}')"
class="bg-blue-600 btn">
Edit
</button>

<button
onclick="deleteCustomer('${id}')"
class="bg-red-600 btn">
Delete
</button>

</div>

</div>

`;

});


document.getElementById("customerList")
.innerHTML=
html||
`<div class="text-center text-slate-500 p-8">
No customers found.
</div>`;

}


/* ADD CUSTOMER */

window.openCustomerForm=function(){

document.getElementById("customerModal")
.classList.remove("hidden");

};


window.closeCustomerForm=function(){

document.getElementById("customerModal")
.classList.add("hidden");

};


window.createCustomer=async function(){

const name=document.getElementById("cName").value.trim();

const phone=document.getElementById("cPhone").value.trim();

const address=document.getElementById("cAddress").value.trim();

const username=document.getElementById("cUsername").value.trim();

const email=document.getElementById("cEmail").value.trim();

const packageName=document.getElementById("cPackage").value;

const expiry=document.getElementById("cExpiry").value;


if(!name||!phone||!username){

alert("Name, Phone and Username required.");

return;

}


const id="CUST-"+Date.now();


await set(
ref(db,"customers/"+id),
{
name,
phone,
address,
username,
email,
package:packageName,
"Start Date":today(),
"Expiry Date":expiry,
Status:"Active",
dealerId:dealerId,
createdAt:new Date().toISOString()
}
);


alert("✅ Customer created.");

closeCustomerForm();

clearCustomerForm();

await loadData();

};


/* CLEAR */

function clearCustomerForm(){

[
"cName",
"cPhone",
"cAddress",
"cUsername",
"cEmail",
"cExpiry"
].forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById("cPackage").value="";

}


/* DELETE */

window.deleteCustomer=async function(id){

const c=customers[id];

if(!c)return;

if(!confirm(
"Delete "+(c.name||"customer")+"?"
))
return;

await remove(
ref(db,"customers/"+id)
);

await loadData();

};


/* EDIT */

window.editCustomer=async function(id){

const c=customers[id];

if(!c)return;

const name=prompt(
"Customer Name",
c.name||""
);

if(name===null)return;

const phone=prompt(
"Phone",
c.phone||""
);

if(phone===null)return;

const expiry=prompt(
"Expiry Date YYYY-MM-DD",
c["Expiry Date"]||""
);

if(expiry===null)return;


await update(
ref(db,"customers/"+id),
{
name:name,
phone:phone,
"Expiry Date":expiry
}
);

await loadData();

};


/* PACKAGE FORM */

window.openPackageForm=function(){

document.getElementById("packageForm")
.classList.remove("hidden");

};


/* ADD PACKAGE */

window.addPackage=async function(){

const name=document.getElementById("packageName").value.trim();

const speed=document.getElementById("packageSpeed").value.trim();

const price=Number(
document.getElementById("packagePrice").value
);


if(!name||!speed||!price){

alert("All package fields required.");

return;

}


const id="PKG-"+Date.now();


await set(
ref(db,"packages/"+id),
{
name,
speed,
Price:price,
Status:"Active",
dealerId:dealerId,
createdAt:new Date().toISOString()
}
);


alert("✅ Package added.");

document.getElementById("packageName").value="";
document.getElementById("packageSpeed").value="";
document.getElementById("packagePrice").value="";

await loadData();

};


/* PACKAGES */

function renderPackages(){

const box=document.getElementById("packageList");

let html="";


Object.entries(packages)
.forEach(([id,p])=>{

if(p.dealerId && p.dealerId!==dealerId)
return;


html+=`

<div class="card p-5">

<div class="text-indigo-400 text-2xl">
⚡
</div>

<h3 class="text-lg font-black mt-2">
${esc(p.name||id)}
</h3>

<p class="text-slate-400">
${esc(p.speed||"-")}
</p>

<div class="text-2xl font-black mt-3">
Rs ${Number(
p.Price||p.price||0
).toLocaleString()}
</div>

<div class="flex gap-2 mt-4">

<button
onclick="editPackage('${id}')"
class="bg-blue-600 btn">
Edit
</button>

<button
onclick="deletePackage('${id}')"
class="bg-red-600 btn">
Delete
</button>

</div>

</div>

`;

});


box.innerHTML=
html||
`<p class="text-slate-500">
No packages found.
</p>`;

}


function renderPackageOptions(){

const select=
document.getElementById("cPackage");

select.innerHTML=
`<option value="">
Select Package
</option>`;


Object.entries(packages)
.forEach(([id,p])=>{

if(p.dealerId && p.dealerId!==dealerId)
return;

select.innerHTML+=`

<option value="${esc(p.name||id)}">

/* CREATE BILLS */

window.createAllBills=async function(){

const month=
new Date().toISOString().slice(0,7);

let count=0;


for(
const [id,c] of Object.entries(customers)
){

if(c.dealerId && c.dealerId!==dealerId)
continue;


const amount=
Number(
c["Monthly fee"]||
c.monthlyFee||
0
);


if(!amount)
continue;


const billId=
"BILL-"+Date.now()+"-"+count;


await set(
ref(db,"bills/"+billId),
{
customerId:id,
dealerId:dealerId,
Amount:amount,
DueDate:today(),
Month:month,
Status:"Unpaid",
createdAt:new Date().toISOString()
}
);


count++;

}


alert(
"✅ "+count+" bills created."
);


await loadData();

};

/* WHATSAPP */

window.sendWhatsApp=function(id){

const c=customers[id];

if(!c)return;


let phone=
String(c.phone||"")
.replace(/\D/g,"");


if(phone.startsWith("0"))
phone="92"+phone.substring(1);


const amount=
Number(
c["Monthly fee"]||
c.monthlyFee||
0
);


const message=
`🌐 ISP BILL

Customer: ${c.name||"-"}

Username: ${c.username||"-"}

Package: ${c.package||"-"}

Monthly Fee: Rs ${amount}

Expiry Date: ${
c["Expiry Date"]||"-"
}

Due Date: ${
c.DueDate||c.duedate||"-"
}

Thank you.`;


window.open(
"https://wa.me/"+
phone+
"?text="+
encodeURIComponent(message),
"_blank"
);

};


/* EXPIRY TODAY ALERT */

function checkExpiryToday(){

const todayDate=today();

const expiring=[];


Object.entries(customers)
.forEach(([id,c])=>{

c.expiryDate||
"";

);

});

alert(
"⚠️ EXPIRY TODAY\n\n"+
expiring.join("\n")
);

},700);

}

}


/* TODAY */

function today(){

const d=new Date();

return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

}

/* ESCAPE */

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
