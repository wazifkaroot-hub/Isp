<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut,
    setPersistence,
    browserLocalPersistence
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getDatabase,
    ref,
    get,
    set,
    update,
    remove
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================================
FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBAzVYtCzLzdM9R-Lt1-8EiUpy9_dPrj6E",

    authDomain:
    "isp-billing-system-27cf8.firebaseapp.com",

    databaseURL:
    "https://isp-billing-system-27cf8-default-rtdb.firebaseio.com",

    projectId:
    "isp-billing-system-27cf8",

    storageBucket:
    "isp-billing-system-27cf8.firebasestorage.app",

    messagingSenderId:
    "643339508063",

    appId:
    "1:643339508063:web:232e6769f7128b6e323eea",

    measurementId:
    "G-J0QK9KKPC6"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getDatabase(app);


const provider =
new GoogleAuthProvider();


provider.setCustomParameters({
    prompt:"select_account"
});


/* =====================================================
GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let currentDealer = null;

let currentDealerId = null;

let customers = {};

let packages = {};

let bills = {};

let payments = {};


/* =====================================================
LOCAL LOGIN PERSISTENCE
===================================================== */

try{

    await setPersistence(
        auth,
        browserLocalPersistence
    );

}catch(error){

    console.error(
        "Persistence error:",
        error
    );

}


/* =====================================================
GOOGLE LOGIN
===================================================== */

document
.getElementById("googleBtn")
.addEventListener(
"click",
async()=>{

    const button =
    document.getElementById(
        "googleBtn"
    );

    const error =
    document.getElementById(
        "loginError"
    );

    error.innerText = "";

    button.disabled = true;

    button.innerText =
    "Signing in...";


    try{

        await signInWithPopup(
            auth,
            provider
        );

    }catch(e){

        console.error(e);

        error.innerText =
        e.code+
        " : "+
        e.message;

        button.disabled = false;

        button.innerText =
        "Continue with Google";

    }

});


/* =====================================================
AUTH STATE
===================================================== */

onAuthStateChanged(
auth,
async(user)=>{

    if(!user){

        currentUser = null;

        showLogin();

        return;

    }


    currentUser = user;


    document
    .getElementById("userEmail")
    .innerText =
    user.email || "";


    try{

        /*
        Load dealers.
        */

        const dealerSnap =
        await get(
            ref(db,"dealers")
        );


        if(
            !dealerSnap.exists()
        ){

            showLicense();

            return;

        }


        const allDealers =
        dealerSnap.val();


        /*
        Find dealer by Gmail.
        */

        let foundDealer = null;

        let foundId = null;


        Object
        .entries(
            allDealers || {}
        )
        .forEach(
        ([id,d])=>{

            if(
                foundDealer
            ){
                return;
            }


            const dealerEmail =
            String(
                d.email ||
                d.Email ||
                ""
            )
            .trim()
            .toLowerCase();


            const googleEmail =
            String(
                user.email ||
                ""
            )
            .trim()
            .toLowerCase();


            if(
                dealerEmail &&
                dealerEmail === googleEmail
            ){

                foundDealer = d;

                foundId = id;

            }

        });


        /*
        Dealer found.
        */

        if(
            foundDealer
        ){

            currentDealer =
            foundDealer;

            currentDealerId =
            foundId;


            /*
            Check browser license verification.
            */

            const verified =
            localStorage.getItem(
                "isp_license_verified"
            );


            const savedUID =
            localStorage.getItem(
                "isp_license_uid"
            );


            const savedDealer =
            localStorage.getItem(
                "isp_license_dealer"
            );


            if(
                verified === "true" &&
                savedUID === user.uid &&
                savedDealer === foundId
            ){

                await startDashboard();

                return;

            }


            showLicense();

            return;

        }


        /*
        No dealer for Gmail.
        */

        showLicense();


    }catch(error){

        console.error(
            "Firebase error:",
            error
        );


        document
        .getElementById(
            "loginError"
        )
        .innerText =
        "Firebase error: "+
        error.message;


        showLogin();

    }

});


/* =====================================================
SHOW LOGIN
===================================================== */

function showLogin(){

    document
    .getElementById("loginPage")
    .classList
    .remove("hidden");


    document
    .getElementById("licensePage")
    .classList
    .add("hidden");


    document
    .getElementById("app")
    .classList
    .add("hidden");

}


/* =====================================================
SHOW LICENSE
===================================================== */

function showLicense(){

    document
    .getElementById("loginPage")
    .classList
    .add("hidden");


    document
    .getElementById("licensePage")
    .classList
    .remove("hidden");


    document
    .getElementById("app")
    .classList
    .add("hidden");


    if(currentUser){

        document
        .getElementById(
            "licenseAccount"
        )
        .innerText =
        "Signed in as "+
        currentUser.email;

    }

}


/* =====================================================
VERIFY LICENSE
===================================================== */

document
.getElementById("verifyBtn")
.addEventListener(
"click",
verifyLicense
);


async function verifyLicense(){

    if(!currentUser){

        showLogin();

        return;

    }


    const key =
    document
    .getElementById(
        "licenseInput"
    )
    .value
    .trim()
    .toUpperCase();


    const error =
    document
    .getElementById(
        "licenseError"
    );


    const button =
    document
    .getElementById(
        "verifyBtn"
    );


    error.innerText = "";


    if(!key){

        error.innerText =
        "❌ Enter License Key.";

        return;

    }


    button.disabled = true;

    button.innerText =
    "Verifying...";


    try{

        /*
        Always load fresh dealer data.
        */

        const snap =
        await get(
            ref(db,"dealers")
        );


        if(
            !snap.exists()
        ){

            error.innerText =
            "❌ Dealer database not found.";

            return;

        }


        const all =
        snap.val();


        let dealer = null;

        let dealerId = null;


        Object
        .entries(
            all || {}
        )
        .forEach(
        ([id,d])=>{

            if(dealer){
                return;
            }


            const dealerKey =
            String(
                d.LicenseKey ||
                d.licenseKey ||
                ""
            )
            .trim()
            .toUpperCase();


            if(
                dealerKey === key
            ){

                dealer = d;

                dealerId = id;

            }

        });


        if(!dealer){

            error.innerText =
            "❌ Invalid License Key.";

            return;

        }


        /*
        Gmail ownership.
        */

        const dealerEmail =
        String(
            dealer.email ||
            dealer.Email ||
            ""
        )
        .trim()
        .toLowerCase();


        const googleEmail =
        String(
            currentUser.email ||
            ""
        )
        .trim()
        .toLowerCase();


        if(
            dealerEmail &&
            dealerEmail !== googleEmail
        ){

            error.innerText =
            "❌ This license belongs to another Gmail.";

            return;

        }


        /*
        Status.
        */

        const status =
        String(
            dealer.status ||
            dealer.Status ||
            "active"
        )
        .toLowerCase();


        if(
            status === "suspended" ||
            status === "inactive"
        ){

            error.innerText =
            "❌ Dealer account is suspended.";

            return;

        }


        /*
        Expiry.
        */

        const expiry =
        dealer.LicenseExpiry ||
        dealer.licenseExpiry ||
        "";


        if(expiry){

            const expiryDate =
            new Date(
                expiry+"T23:59:59"
            );


            if(
                expiryDate < new Date()
            ){

                error.innerText =
                "❌ License expired.";

                return;

            }

        }


        /*
        SAVE SESSION
        */

        localStorage.setItem(
            "isp_license_verified",
            "true"
        );


        localStorage.setItem(
            "isp_license_uid",
            currentUser.uid
        );


        localStorage.setItem(
            "isp_license_dealer",
            dealerId
        );


        currentDealer =
        dealer;

        currentDealerId =
        dealerId;


        /*
        Start.
        */

        await startDashboard();


    }catch(e){

        console.error(e);

        error.innerText =
        "❌ Firebase error: "+
        e.message;

    }finally{

        button.disabled = false;

        button.innerText =
        "Verify License";

    }

}


/* =====================================================
START DASHBOARD
===================================================== */

async function startDashboard(){

    document
    .getElementById("loginPage")
    .classList
    .add("hidden");


    document
    .getElementById("licensePage")
    .classList
    .add("hidden");


    document
    .getElementById("app")
    .classList
    .remove("hidden");


    await loadAll();

}


/* =====================================================
LOAD ALL
===================================================== */

async function loadAll(){

    try{

        const customerSnap =
        await get(
            ref(db,"customers")
        );


        const packageSnap =
        await get(
            ref(db,"packages")
        );


        const billSnap =
        await get(
            ref(db,"bills")
        );


        const paymentSnap =
        await get(
            ref(db,"payments")
        );


        customers =
        customerSnap.exists()
        ? customerSnap.val()
        : {};


        packages =
        packageSnap.exists()
        ? packageSnap.val()
        : {};


        bills =
        billSnap.exists()
        ? billSnap.val()
        : {};


        payments =
        paymentSnap.exists()
        ? paymentSnap.val()
        : {};


        renderEverything();

        checkExpiryToday();


    }catch(error){

        console.error(
            "Firebase error:",
            error
        );


        alert(
            "Firebase error: "+
            error.message
        );

    }

}


/* =====================================================
OWNERSHIP
===================================================== */

function belongsToDealer(data){

    if(!data){
        return false;
    }


    /*
    Existing old records without
    dealerId are allowed.
    */

    if(
        !data.dealerId
    ){

        return true;

    }


    return (
        data.dealerId ===
        currentDealerId
    );

}


/* =====================================================
RENDER
===================================================== */

function renderEverything(){

    renderStats();

    renderDealerInfo();

    renderCustomers();

    renderPackages();

    renderBills();

    renderPayments();

    renderPackageOptions();

}

NAVIGATION

function(name){

    page=>{

        document
        .getElementById(page)
        .classList
        .add("hidden");

    });


    document

/* =====================================================
GENERATE BILLS
===================================================== */

window.generateBills =
async function(){

    const month =
    today().slice(0,7);


    let count = 0;


    for(
        const [customerId,c]
        of Object.entries(
            customers || {}
        )
    ){

        if(
            !belongsToDealer(c)
        ){
            continue;
        }


        const amount =
        Number(
            c["Monthly fee"] ||
            c.monthlyFee ||
            0
        );


        if(!amount){
            continue;
        }


        const already =
        Object
        .values(
            bills || {}
        )
        .some(
        bill=>{

            return (
                bill.customerId ===
                customerId
            )
            &&
            String(
                bill.Month ||
                bill.month ||
                ""
            ) === month;

        });


        if(already){
            continue;
        }


        const id =
        "BILL-"+
        Date.now()+
        "-"+
        count;


        await set(
            ref(
                db,
                "bills/"+id
            ),
            {

                customerId:
                customerId,

                dealerId:
                currentDealerId,

                Amount:
                amount,

                Duedate:
                c["Expiry Date"] ||
                c.expiryDate ||
                today(),

                Month:
                month,

                Status:
                "Unpaid",

                createdAt:
                new Date().toISOString()

            }
        );


        count++;

    }


    alert(
        "✅ "+
        count+
        " bill(s) generated."
    );


    await loadAll();

};

    }


    if(!phone){

        alert(
            "Customer phone number missing."
        );

        return;

    }


    const fee =
    Number(
        c["Monthly fee"] ||
        c.monthlyFee ||
        0
    );


    const message =
`🌐 ISP BILL

Customer: ${c.name || "-"}
Username: ${c.username || "-"}
Package: ${c.package || "-"}
Monthly Fee: Rs ${fee.toLocaleString()}
Expiry Date: ${
    c["Expiry Date"] ||
    c.expiryDate ||
    "-"

/* =====================================================
EXPIRY TODAY ALERT
===================================================== */

function checkExpiryToday(){

    const currentDate =
    today();


    const expiring = [];


    Object
    .entries(
        customers || {}
    )
    .forEach(
    ([id,c])=>{

        if(
            !belongsToDealer(c)
        ){
            return;
        }


        const expiry =
        c["Expiry Date"] ||
        c.expiryDate ||
        "";


        if(
            expiry ===
            currentDate
        ){

            expiring.push(
                c.name ||
                id
            );

        }

    });


    if(
        expiring.length
    ){

        setTimeout(
        ()=>{

            alert(
                "⚠️ EXPIRY TODAY\n\n"+
                expiring.join("\n")
            );

        },700);

    }

}

function today(){

    const d =
    new Date();


    return (
        d.getFullYear()+
        "-"+
        String(
            d.getMonth()+1
        ).padStart(2,"0")+
        "-"+
        String(
            d.getDate()
        ).padStart(2,"0")
    );

}

window.logoutDealer =
async function(){

    /*
    Clear license verification only
    when user explicitly logs out.
    */

    localStorage.removeItem(
        "isp_license_verified"
    );


    localStorage.removeItem(
        "isp_license_uid"
    );


    localStorage.removeItem(
        "isp_license_dealer"
    );


    currentDealer = null;

    currentDealerId = null;


    await signOut(auth);


    showLogin();

};

/* =====================================================
ESCAPE HTML
===================================================== */

function esc(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
