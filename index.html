<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISP Dealer Billing</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  background:#f1f5f9;
  font-family:Arial,sans-serif;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}
input,select{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:10px;
}
button{
  border-radius:10px;
  padding:11px 16px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage"
class="min-h-screen flex items-center justify-center p-5">

  <div class="card w-full max-w-md text-center">

    <div class="text-5xl mb-4">🌐</div>

    <h1 class="text-3xl font-bold">
      ISP Billing
    </h1>

    <p class="text-gray-500 mt-2 mb-6">
      Internet Provider Management System
    </p>

    <button
      id="googleLogin"
      class="w-full bg-black text-white">
      Continue with Google
    </button>

    <p
      id="loginError"
      class="text-red-500 text-sm mt-4">
    </p>

  </div>
</div>


<!-- DEALER APP -->
<div id="app" class="hidden">

<header class="bg-white border-b p-4">

  <div class="max-w-7xl mx-auto flex justify-between items-center">

    <div>
      <h1 class="text-xl font-bold">
        ISP Dealer Panel
      </h1>

      <p id="userEmail"
      class="text-sm text-gray-500">
      </p>
    </div>

    <button
      id="logout"
      class="bg-red-500 text-white">
      Logout
    </button>

  </div>

</header>


<main class="max-w-7xl mx-auto p-4">


<!-- DEALER INFO -->
<div id="dealerInfo"
class="card mb-5">
  Loading dealer...
</div>


<!-- DASHBOARD -->
<div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-5">

  <div class="card">
    <p class="text-gray-500">Customers</p>
    <h2 id="totalCustomers"
    class="text-2xl font-bold">0</h2>
  </div>

  <div class="card">
    <p class="text-gray-500">Active</p>
    <h2 id="activeCustomers"
    class="text-2xl font-bold">0</h2>
  </div>

  <div class="card">
    <p class="text-gray-500">Expired</p>
    <h2 id="expiredCustomers"
    class="text-2xl font-bold">0</h2>
  </div>

  <div class="card">
    <p class="text-gray-500">Unpaid</p>
    <h2 id="unpaidBills"
    class="text-2xl font-bold">0</h2>
  </div>

  <div class="card">
    <p class="text-gray-500">Paid</p>
    <h2 id="paidAmount"
    class="text-2xl font-bold">Rs 0</h2>
  </div>

</div>


<!-- EXPIRY ALERT -->
<div class="card mb-5">

  <div class="flex justify-between items-center">

    <h2 class="text-xl font-bold">
      🔔 Expiry Alerts
    </h2>

    <span id="alertCount"
    class="bg-red-500 text-white px-3 py-1 rounded-full">
      0
    </span>

  </div>

  <div id="alerts" class="mt-4">
    No alerts.
  </div>

</div>


<!-- ADD CUSTOMER -->
<div class="card mb-5">

  <h2 class="text-xl font-bold mb-4">
    👤 Add Customer
  </h2>

  <div class="grid md:grid-cols-3 gap-3">

    <input id="cName"
    placeholder="Customer Name">

    <input id="cPhone"
    placeholder="Phone">

    <input id="cAddress"
    placeholder="Address">

    <input id="cUsername"
    placeholder="ISP Username">

    <input id="cPackage"
    placeholder="Package">

    <input id="cFee"
    type="number"
    placeholder="Monthly Fee">

    <input id="cStart"
    type="date">

    <input id="cExpiry"
    type="date">

    <select id="cStatus">
      <option value="active">Active</option>
      <option value="suspended">Suspended</option>
    </select>

  </div>

  <button
    id="addCustomer"
    class="bg-blue-600 text-white mt-4">
    + Add Customer
  </button>

</div>


<!-- CUSTOMER LIST -->
<div class="card mb-5">

  <div class="flex justify-between items-center mb-4">

    <h2 class="text-xl font-bold">
      👥 Customers
    </h2>

    <input
      id="search"
      class="max-w-xs"
      placeholder="Search Customer">

  </div>

  <div class="overflow-x-auto">

    <table class="w-full text-sm">

      <thead>

        <tr class="border-b">

          <th class="p-2 text-left">Name</th>
          <th class="p-2 text-left">Phone</th>
          <th class="p-2 text-left">Package</th>
          <th class="p-2 text-left">Fee</th>
          <th class="p-2 text-left">Expiry</th>
          <th class="p-2 text-left">Status</th>
          <th class="p-2">Action</th>

        </tr>

      </thead>

      <tbody id="customerTable"></tbody>

    </table>

  </div>

</div>


<!-- PACKAGES -->
<div class="card mb-5">

  <h2 class="text-xl font-bold mb-4">
    📦 Packages
  </h2>

  <div class="grid md:grid-cols-4 gap-3">

    <input id="pName"
    placeholder="Package Name">

    <input id="pSpeed"
    placeholder="Speed e.g. 20 Mbps">

    <input id="pPrice"
    type="number"
    placeholder="Monthly Price">

    <button
      id="addPackage"
      class="bg-green-600 text-white">
      + Add Package
    </button>

  </div>

  <div
    id="packageList"
    class="grid md:grid-cols-3 gap-3 mt-5">
  </div>

</div>


<!-- BILLS -->
<div class="card mb-5">

  <h2 class="text-xl font-bold mb-4">
    🧾 Create Bill
  </h2>

  <div class="grid md:grid-cols-3 gap-3">

    <select id="billCustomer">
      <option value="">Select Customer</option>
    </select>

    <input
      id="billAmount"
      type="number"
      placeholder="Bill Amount">

    <input
      id="billDue"
      type="date">

  </div>

  <button
    id="createBill"
    class="bg-purple-600 text-white mt-4">
    Create Bill
  </button>

  <div id="billList" class="mt-5"></div>

</div>


<!-- PAYMENTS -->
<div class="card">

  <h2 class="text-xl font-bold mb-4">
    💰 Add Payment
  </h2>

  <div class="grid md:grid-cols-3 gap-3">

    <select id="payCustomer">
      <option value="">Select Customer</option>
    </select>

    <input
      id="payAmount"
      type="number"
      placeholder="Payment Amount">

    <select id="payMethod">

      <option value="Cash">Cash</option>
      <option value="Bank">Bank</option>
      <option value="JazzCash">JazzCash</option>
      <option value="Easypaisa">Easypaisa</option>

    </select>

  </div>

  <button
    id="addPayment"
    class="bg-emerald-600 text-white mt-4">
    Add Payment
  </button>

  <div id="paymentList" class="mt-5"></div>

</div>

</main>
</div>


<script type="module">

/* FIREBASE */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getDatabase,
  ref,
  get,
  set
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyBAzVYtCzLzdM9R-Lt1-8EiUpy9_dPrj6E",

  authDomain:
  "isp-billing-system-27cf8.firebaseapp.com",

  databaseURL:
  "https://isp-billing-system-27cf8-default-rtdb.firebaseio.com",

  projectId:
  "isp-billing-system-27cf8",

  storageBucket:
  "isp-billing-system-27cf8.firebasestorage.app",

  messagingSenderId:
  "643339508063",

  appId:
  "1:643339508063:web:232e6769f7128b6e323eea",

  measurementId:
  "G-J0QK9KKPC6"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);

const googleProvider =
new GoogleAuthProvider();

googleProvider.setCustomParameters({
  prompt:"select_account"
});


let dealerId = null;

let customers = {};

let packages = {};

let bills = {};

let payments = {};


/* GOOGLE LOGIN */

document
.getElementById("googleLogin")
.onclick = async () => {

  const button =
  document.getElementById("googleLogin");

  const error =
  document.getElementById("loginError");

  error.innerText = "";

  button.disabled = true;

  button.innerText =
  "Signing in...";

  try {

    await signInWithPopup(
      auth,
      googleProvider
    );

  } catch(errorObject) {

    console.error(errorObject);

    error.innerText =
      errorObject.code +
      " : " +
      errorObject.message;

    button.disabled = false;

    button.innerText =
      "Continue with Google";

  }

};


/* AUTH */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      document
      .getElementById("loginPage")
      .classList
      .remove("hidden");

      document
      .getElementById("app")
      .classList
      .add("hidden");

      return;

    }


    document
    .getElementById("loginPage")
    .classList
    .add("hidden");

    document
    .getElementById("app")
    .classList
    .remove("hidden");


    document
    .getElementById("userEmail")
    .innerText =
    user.email;


    await loadDealer(user.uid);

  }
);


/* LOGOUT */

document
.getElementById("logout")
.onclick = async () => {

  await signOut(auth);

};


/* LOAD DEALER */

async function loadDealer(uid){

  try {

    const snapshot =
    await get(
      ref(db,"dealers")
    );


    if(!snapshot.exists()){

      showDealerError(
        "No dealer records found."
      );

      return;

    }


    const dealers =
    snapshot.val();


    const found =
    Object
    .entries(dealers)
    .find(
      ([id,dealer]) =>
      dealer.uid === uid
    );


    if(!found){

      showDealerError(
        "This Google account is not registered as a dealer."
      );

      return;

    }


    dealerId =
    found[0];


    const dealer =
    found[1];


    if(
      dealer.status &&
      dealer.status !== "active"
    ){

      showDealerError(
        "Dealer account is inactive."
      );

      return;

    }


    document
    .getElementById("dealerInfo")
    .innerHTML = `

      <h2 class="text-xl font-bold">
        👨‍💼 ${escapeHTML(dealer.name || "Dealer")}
      </h2>

      <p class="text-gray-500 mt-1">
        ${escapeHTML(dealer.email || "")}
      </p>

      <div class="mt-3 grid md:grid-cols-3 gap-3">

        <div>
          <b>License</b>
          <p>${escapeHTML(dealer.licenseKey || "-")}</p>
        </div>

        <div>
          <b>Expiry</b>
          <p>${escapeHTML(dealer.licenseExpiry || "-")}</p>
        </div>

        <div>
          <b>Status</b>
          <p class="text-green-600">
            ● Active
          </p>
        </div>

      </div>
    `;


    await loadData();

  }
  catch(error){

    console.error(error);

    showDealerError(
      error.message
    );

  }

}


function showDealerError(message){

  document
  .getElementById("dealerInfo")
  .innerHTML = `

    <div class="text-red-500 font-bold">
      ${escapeHTML(message)}
    </div>

  `;

}


/* LOAD DATA */

async function loadData(){

  if(!dealerId) return;


  const base =
  "dealers/" + dealerId;


  const customerSnapshot =
  await get(
    ref(
      db,
      base + "/customers"
    )
  );


  const packageSnapshot =
  await get(
    ref(
      db,
      base + "/packages"
    )
  );


  const billSnapshot =
  await get(
    ref(
      db,
      base + "/bills"
    )
  );


  const paymentSnapshot =
  await get(
    ref(
      db,
      base + "/payments"
    )
  );


  customers =
  customerSnapshot.exists()
  ? customerSnapshot.val()
  : {};


  packages =
  packageSnapshot.exists()
  ? packageSnapshot.val()
  : {};


  bills =
  billSnapshot.exists()
  ? billSnapshot.val()
  : {};


  payments =
  paymentSnapshot.exists()
  ? paymentSnapshot.val()
  : {};


  renderCustomers();

  renderPackages();

  renderBills();

  renderPayments();

  updateDashboard();

  showAlerts();

}


/* ADD CUSTOMER */

document
.getElementById("addCustomer")
.onclick = async () => {

  if(!dealerId){

    alert("Dealer login required.");

    return;

  }


  const name =
  document
  .getElementById("cName")
  .value
  .trim();


  if(!name){

    alert("Customer name required.");

    return;

  }


  const id =
  "CUST-" + Date.now();


  const customer = {

    id,

    name,

    phone:
    document
    .getElementById("cPhone")
    .value
    .trim(),

    address:
    document
    .getElementById("cAddress")
    .value
    .trim(),

    username:
    document
    .getElementById("cUsername")
    .value
    .trim(),

    package:
    document
    .getElementById("cPackage")
    .value
    .trim(),

    monthlyFee:
    Number(
      document
      .getElementById("cFee")
      .value || 0
    ),

    startDate:
    document
    .getElementById("cStart")
    .value,

    expiryDate:
    document
    .getElementById("cExpiry")
    .value,

    status:
    document
    .getElementById("cStatus")
    .value,

    createdAt:
    new Date().toISOString()

  };


  await set(

    ref(
      db,
      "dealers/" +
      dealerId +
      "/customers/" +
      id
    ),

    customer

  );


  alert("✅ Customer added");

  clearCustomerForm();

  await loadData();

};


function clearCustomerForm(){

  [
    "cName",
    "cPhone",
    "cAddress",
    "cUsername",
    "cPackage",
    "cFee",
    "cStart",
    "cExpiry"
  ]
  .forEach(
    id =>
    document
    .getElementById(id)
    .value = ""
  );

}


/* CUSTOMERS */

function renderCustomers(){

  const search =
  document
  .getElementById("search")
  .value
  .toLowerCase();


  let html = "";

  let options =
  `<option value="">
  Select Customer
  </option>`;


  Object
  .entries(customers)
  .forEach(
    ([id,c]) => {

      const text =
      (
        (c.name || "") +
        (c.phone || "") +
        (c.username || "") +
        (c.package || "")
      )
      .toLowerCase();


      if(
        !text.includes(search)
      ) return;


      html += `

        <tr class="border-b">

          <td class="p-2">
            ${escapeHTML(c.name || "")}
          </td>

          <td class="p-2">
            ${escapeHTML(c.phone || "")}
          </td>

          <td class="p-2">
            ${escapeHTML(c.package || "")}
          </td>

          <td class="p-2">
            Rs ${Number(c.monthlyFee || 0)}
          </td>

          <td class="p-2">
            ${escapeHTML(c.expiryDate || "")}
          </td>

          <td class="p-2">
            ${escapeHTML(c.status || "")}
          </td>

          <td class="p-2">

            <button
            class="bg-green-600 text-white"
            onclick="sendWhatsApp('${id}')">

              WhatsApp

            </button>

          </td>

        </tr>
      `;


      options += `

        <option value="${id}">
          ${escapeHTML(c.name || id)}
        </option>

      `;

    }
  );


  document
  .getElementById("customerTable")
  .innerHTML = html;


  document
  .getElementById("billCustomer")
  .innerHTML = options;


  document
  .getElementById("payCustomer")
  .innerHTML = options;

}


document
.getElementById("search")
.oninput =
renderCustomers;


/* WHATSAPP */

window.sendWhatsApp =
function(id){

  const customer =
  customers[id];


  if(!customer) return;


  const phone =
  (customer.phone || "")
  .replace(/\D/g,"");


  if(!phone){

    alert(
      "Customer phone number missing."
    );

    return;

  }


  const message =
`Assalam-o-Alaikum ${customer.name},

Aapka internet package ${customer.expiryDate || "soon"} ko expire ho raha hai.

Kindly package renew kar dein.

Shukriya.`;


  window.open(
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(message),
    "_blank"
  );

};


/* ALERTS */

function showAlerts(){

  const now =
  new Date();

  let html = "";

  let count = 0;


  Object
  .entries(customers)
  .forEach(
    ([id,c]) => {

      if(!c.expiryDate)
      return;


      const expiry =
      new Date(c.expiryDate);


      const days =
      Math.ceil(
        (expiry - now) /
        86400000
      );


      if(days <= 7){

        count++;


        let statusText;


        if(days < 0){

          statusText =
          "🔴 EXPIRED";

        }
        else if(days === 0){

          statusText =
          "🟠 EXPIRES TODAY";

        }
        else{

          statusText =
          "🟡 " +
          days +
          " DAYS LEFT";

        }


        html += `

          <div
          class="border rounded-xl p-4 mb-3">

            <b>
              ${escapeHTML(c.name || "")}
            </b>

            <p>
              ${statusText}
            </p>

            <p class="text-gray-500">
              Expiry:
              ${escapeHTML(c.expiryDate)}
            </p>

            <button
            class="bg-green-600 text-white mt-2"
            onclick="sendWhatsApp('${id}')">

              WhatsApp

            </button>

          </div>

        `;

      }

    }
  );


  document
  .getElementById("alerts")
  .innerHTML =
  html || "No expiry alerts.";


  document
  .getElementById("alertCount")
  .innerText =
  count;

}


/* ADD PACKAGE */

document
.getElementById("addPackage")
.onclick = async () => {

  if(!dealerId) return;


  const name =
  document
  .getElementById("pName")
  .value
  .trim();


  if(!name){

    alert("Package name required.");

    return;

  }


  const id =
  "PKG-" + Date.now();


  await set(

    ref(
      db,
      "dealers/" +
      dealerId +
      "/packages/" +
      id
    ),

    {

      id,

      name,

      speed:
      document
      .getElementById("pSpeed")
      .value
      .trim(),

      price:
      Number(
        document
        .getElementById("pPrice")
        .value || 0
      ),

      status:"active",

      createdAt:
      new Date().toISOString()

    }

  );


  document.getElementById("pName").value="";
  document.getElementById("pSpeed").value="";
  document.getElementById("pPrice").value="";


  alert("✅ Package added");

  await loadData();

};


/* PACKAGES */

function renderPackages(){

  let html = "";


  Object
  .values(packages)
  .forEach(
    p => {

      html += `

        <div
        class="border rounded-xl p-4">

          <h3 class="font-bold">
            ${escapeHTML(p.name || "")}
          </h3>

          <p>
            Speed:
            ${escapeHTML(p.speed || "")}
          </p>

          <p>
            Price:
            Rs ${Number(p.price || 0)}
          </p>

          <p class="text-green-600">
            ● Active
          </p>

        </div>

      `;

    }
  );


  document
  .getElementById("packageList")
  .innerHTML =
  html || "No packages.";

}


/* CREATE BILL */

document
.getElementById("createBill")
.onclick = async () => {

  if(!dealerId) return;


  const customerId =
  document
  .getElementById("billCustomer")
  .value;


  const amount =
  Number(
    document
    .getElementById("billAmount")
    .value || 0
  );


  if(
    !customerId ||
    amount <= 0
  ){

    alert(
      "Select customer and enter amount."
    );

    return;

  }


  const id =
  "BILL-" + Date.now();


  await set(

    ref(
      db,
      "dealers/" +
      dealerId +
      "/bills/" +
      id
    ),

    {

      id,

      customerId,

      amount,

      dueDate:
      document
      .getElementById("billDue")
      .value,

      status:"unpaid",

      createdAt:
      new Date().toISOString()

    }

  );


  document
  .getElementById("billAmount")
  .value = "";


  alert("✅ Bill created");

  await loadData();

};


/* BILLS */

function renderBills(){

  let html = "";


  Object
  .values(bills)
  .forEach(
    b => {

      const customer =
      customers[b.customerId];


      html += `

        <div
        class="border rounded-xl p-4 mb-3">

          <b>
            ${escapeHTML(
              customer?.name ||
              b.customerId
            )}
          </b>

          <p>
            Bill:
            Rs ${Number(b.amount || 0)}
          </p>

          <p>
            Due:
            ${escapeHTML(b.dueDate || "")}
          </p>

          <p>
            Status:
            <b>
              ${escapeHTML(b.status || "")}
            </b>
          </p>

        </div>

      `;

    }
  );


  document
  .getElementById("billList")
  .innerHTML =
  html || "No bills.";

}


/* PAYMENT */

document
.getElementById("addPayment")
.onclick = async () => {

  if(!dealerId) return;


  const customerId =
  document
  .getElementById("payCustomer")
  .value;


  const amount =
  Number(
    document
    .getElementById("payAmount")
    .value || 0
  );


  if(
    !customerId ||
    amount <= 0
  ){

    alert(
      "Select customer and enter amount."
    );

    return;

  }


  const id =
  "PAY-" + Date.now();


  await set(

    ref(
      db,
      "dealers/" +
      dealerId +
      "/payments/" +
      id
    ),

    {

      id,

      customerId,

      amount,

      method:
      document
      .getElementById("payMethod")
      .value,

      status:"paid",

      date:
      new Date().toISOString()

    }

  );


  document
  .getElementById("payAmount")
  .value = "";


  alert("✅ Payment added");

  await loadData();

};


/* PAYMENTS */

function renderPayments(){

  let html = "";


  Object
  .values(payments)
  .slice(-20)
  .reverse()
  .forEach(
    p => {

      const customer =
      customers[p.customerId];


      html += `

        <div
        class="border rounded-xl p-3 mb-2">

          <b>
            ${escapeHTML(
              customer?.name ||
              p.customerId
            )}
          </b>

          <p>
            Rs ${Number(p.amount || 0)}
          </p>

          <p>
            ${escapeHTML(p.method || "")}
          </p>

          <p class="text-green-600">
            ● Paid
          </p>

        </div>

      `;

    }
  );


  document
  .getElementById("paymentList")
  .innerHTML =
  html || "No payments.";

}


/* DASHBOARD */

function updateDashboard(){

  const list =
  Object.values(customers);

  const billList =
  Object.values(bills);

  const paymentList =
  Object.values(payments);

  const today =
  new Date();


  document
  .getElementById("totalCustomers")
  .innerText =
  list.length;


  document
  .getElementById("activeCustomers")
  .innerText =
  list.filter(
    c => c.status === "active"
  ).length;


  document
  .getElementById("expiredCustomers")
  .innerText =
  list.filter(
    c =>
    c.expiryDate &&
    new Date(c.expiryDate) < today
  ).length;


  document
  .getElementById("unpaidBills")
  .innerText =
  billList.filter(
    b => b.status === "unpaid"
  ).length;


  const total =
  paymentList.reduce(
    (sum,p) =>
    sum + Number(p.amount || 0),
    0
  );


  document
  .getElementById("paidAmount")
  .innerText =
  "Rs " + total;

}


/* SECURITY */

function escapeHTML(value){

  return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}
